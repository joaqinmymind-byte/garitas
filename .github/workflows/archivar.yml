name: Archivar garitas

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archivar
  cancel-in-progress: false

jobs:
  archivar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 1: el repositorio crece con los datos y no necesitamos
      # su historia completa en cada corrida.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Sin setup-python a proposito: ubuntu-latest ya trae Python 3.12
      # y ese paso costaba ~15 segundos en cada una de las 96 corridas diarias.
      - name: Capturar los dos sentidos
        run: python3 garita.py capturar

      # El reporte es lo caro. Se regenera una vez por hora, no cada 15 min.
      - name: Regenerar el reporte si ya tiene una hora
        run: python3 garita.py reporte --si-viejo 55

      # No-op casi siempre; solo trabaja al cambiar de mes.
      - name: Comprimir meses cerrados
        run: python3 garita.py compactar

      - name: Guardar los cambios
        run: |
          git config user.name  "garita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "captura $(date -u +%Y-%m-%dT%H:%MZ)"
          for intento in 1 2 3; do
            if git push; then
              echo "Guardado."
              exit 0
            fi
            echo "Reintento $intento..."
            git pull --rebase --autostash
            sleep 5
          done
          echo "No se pudo guardar despues de 3 intentos." >&2
          exit 1
