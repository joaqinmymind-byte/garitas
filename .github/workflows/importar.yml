name: Importar historico de SANDAG

# Se corre UNA SOLA VEZ, a mano, desde la pestana Actions.
# Siembra el archivo con las DOS series abiertas de SANDAG:
#   historico/sandag.csv          promedio diario,  2023 -> hoy   (5tga-nezt)
#   historico/sandag_mensual.csv  promedio mensual, 2011 -> 2022  (46bj-bg7a,
#                                 dataset ya descontinuado por SANDAG)
# Juntas dan casi 15 anos de historia sin esperar un solo dia.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bajar las dos series historicas de SANDAG
        run: python3 garita.py importar

      - name: Regenerar el reporte completo
        run: python3 garita.py reporte

      - name: Guardar
        run: |
          git config user.name  "garita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "importar historico de SANDAG"
          git pull --rebase --autostash || true
          git push
