name: Importar histórico de SANDAG

# Esto se corre UNA SOLA VEZ, a mano, desde la pestaña Actions.
# Siembra el archivo con 3.5 años de promedios diarios que SANDAG publica
# abiertos, para no tener que esperar meses a tener patrones.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bajar el histórico de SANDAG
        run: python garita.py importar

      - name: Regenerar el reporte
        run: python garita.py reporte

      - name: Guardar
        run: |
          git config user.name  "garita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "importar historico de SANDAG"
          git pull --rebase --autostash || true
          git push
